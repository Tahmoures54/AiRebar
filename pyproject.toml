[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rebaragent"
version = "1.6.0"
description = "Intelligent Bar Bending Schedule & Cutting Optimization for civil engineers"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Proprietary" }
authors = [{ name = "RebarAgent Team" }]
keywords = ["rebar", "bbs", "cutting-stock", "civil-engineering", "optimization"]
dependencies = [
    "pandas>=1.3.0", "openpyxl>=3.0.0", "reportlab>=3.6.0", "numpy>=1.20.0",
    "PuLP>=2.6.0", "mip>=1.15.0", "svgwrite>=1.4.0", "qrcode>=7.0", "pillow>=9.0",
]

[project.optional-dependencies]
dev = ["pyinstaller>=6.0", "pytest>=7.0"]

[project.scripts]
rebaragent = "main:main"

[tool.setuptools]
py-modules = ["main", "config", "app_state", "generate_license"]

[tool.setuptools.packages.find]
where = ["."]
include = ["db*", "logic*", "shapes*", "ui*", "utils*", "tests*"]
exclude = ["logs*"]
